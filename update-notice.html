<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bản cập nhật Nhà Yến Zalo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#1e293b;font:14px/1.5 "Segoe UI",Arial,sans-serif}.card{height:100vh;padding:24px;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{margin:0;font-size:21px}.version{margin:4px 0 16px;color:#667085}.notes{flex:1;min-height:0;overflow:auto;padding:16px;border:1px solid #e4e9f1;border-radius:10px;background:#fff;white-space:pre-wrap;color:#344054}.progress{height:7px;margin-top:14px;overflow:hidden;border-radius:20px;background:#e7ebf2}.progress span{display:block;height:100%;width:0;background:#1767d9;transition:width .2s}.message{min-height:22px;margin:8px 0;color:#667085}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{height:42px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.later{background:#e9edf3;color:#475467}.primary{background:#1767d9;color:#fff}.primary:disabled{opacity:.55;cursor:default}</style></head>
<body><main class="card"><div class="head"><h1>Bản cập nhật mới</h1></div><p id="version" class="version"></p><section id="notes" class="notes">Đang tải thông tin phiên bản…</section><div class="progress"><span id="progress"></span></div><p id="message" class="message"></p><div class="actions"><button id="later" class="later">Để sau</button><button id="action" class="primary">Cập nhật ngay</button></div></main>
<script>const{ipcRenderer}=require('electron');const version=document.getElementById('version'),notes=document.getElementById('notes'),message=document.getElementById('message'),progress=document.getElementById('progress'),action=document.getElementById('action');let state={};ipcRenderer.on('update-notice-state',(_,next)=>{state=next||{};version.textContent=`Phiên bản ${state.currentVersion||''} → ${state.version||''}`;notes.textContent=state.releaseNotes||'Phiên bản mới cải thiện độ ổn định và trải nghiệm sử dụng.';message.textContent=state.message||'';progress.style.width=`${Math.max(0,Math.min(100,Number(state.progress)||0))}%`;action.disabled=state.status==='downloading';action.textContent=state.status==='downloaded'?'Cài đặt và khởi động lại':state.status==='downloading'?`Đang tải ${state.progress||0}%`:'Cập nhật ngay';});document.getElementById('later').onclick=()=>ipcRenderer.send('update-notice:defer');action.onclick=()=>ipcRenderer.send(state.status==='downloaded'?'update-notice:install':'update-notice:download');ipcRenderer.send('update-notice:ready');</script></body></html>
